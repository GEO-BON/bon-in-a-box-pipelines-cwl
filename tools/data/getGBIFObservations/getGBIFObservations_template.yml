taxa:  # array of type 'string' (optional)
  - Acer saccharum
  - Acer nigrum

scripts_root:  # type 'Directory' (optional)
    class: Directory
    path: a/directory/path
scriptPath: data/getGBIFObservations/getGBIFObservations.py  # default value of type 'string'.
runFolder:  # type 'Directory' (optional)
    class: Directory
    path: a/directory/path
min_year: '2010'  # default value of type 'string'. (optional)
max_year: '2024'  # default value of type 'string'. (optional)
environment:  # type 'File' (optional)
    class: File
    path: a/file/path
envFolderWritable: true  # default value of type 'boolean'.
envFolder:  # type 'Directory' (optional)
    class: Directory
    path: a/directory/path
condaPackURL: https://object-arbutus.alliancecan.ca/swift/v1/3857940e33774dca8ae21e4999fe402e/conda-pack/  # default value of type 'string'.
bbox_crs:  # "https://raw.githubusercontent.com/GEO-BON/bon-in-a-box-pipelines-cwl/refs/heads/main/tools/data/getGBIFObservations/getGBIFObservations.cwl#bbox_crs/crsBBox" record type.
    bbox:  # array of type 'float'
      - 0.1
    CRS:  # "https://raw.githubusercontent.com/GEO-BON/bon-in-a-box-pipelines-cwl/refs/heads/main/tools/data/getGBIFObservations/getGBIFObservations.cwl#bbox_crs/crsBBox/CRS/CRSDefinition" record type.
        wktDef: a_string  # type 'string' (optional)
        proj4Def: a_string  # type 'string' (optional)
        CRSBboxWGS84:  # array of type 'float' (optional)
          - 0.1
        name: a_string  # type 'string' (optional)
        authority: a_string  # type 'string' (optional)
        code: 0  # type 'int' (optional)
        unit: a_string  # type 'string' (optional)
