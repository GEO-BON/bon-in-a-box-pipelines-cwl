name: Export CWL

on:
  workflow_dispatch: {}

jobs:
  export-cwl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CWL repository
        uses: actions/checkout@v4

      - name: Checkout pipeline engine repository
        uses: actions/checkout@v4
        with:
          repository: 'GEO-BON/bon-in-a-box-pipeline-engine'
          ref: '1b72ffd3a940c5d7fdd7999c9ff01a03afa09631'
          path: 'pipeline-engine'
          fetch-depth: 0

      - name: Wipe tools and workflows directories
        run: |
          rm -rf tools/*
          rm -rf workflows/*

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify compiled CWL classes
        working-directory: pipeline-engine/script-server
        run: |
          ./gradlew classes
          echo "Compiled CWL classes:"
          find build/classes/kotlin/main/org/geobon/cwl -type f -print

      - name: Run exportCWL
        working-directory: pipeline-engine/script-server
        env:
          OUTPUT_LOCATION: ${{ github.workspace }}/pipeline-engine/pipeline-repo/output
          PIPELINES_LOCATION: ${{ github.workspace }}/pipeline-engine/pipeline-repo/pipelines
          SCRIPT_STUBS_LOCATION: ${{ github.workspace }}/pipeline-engine/script-stubs
          USERDATA_LOCATION: ${{ github.workspace }}/pipeline-engine/pipeline-repo/userdata
          SCRIPT_LOCATION: ${{ github.workspace }}/pipeline-engine/pipeline-repo/scripts
        run: ./gradlew exportCWL --args="${{ github.workspace }}"